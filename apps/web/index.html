    <script>
      // Apply saved theme preferences before first paint (no flash).
      try {
        var raw = localStorage.getItem('riverly.theme_preferences')
        if (raw) {
          var p = JSON.parse(raw)
          if (p.theme) document.documentElement.dataset.theme = p.theme
          if (p.font) document.documentElement.dataset.font = p.font
          if (p.density) document.documentElement.dataset.density = p.density
          if (p.radius) document.documentElement.dataset.radius = p.radius
        } else {
          var t = localStorage.getItem('riverly.theme')
          if (t) document.documentElement.dataset.theme = t
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
