name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: riverly_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:ci_root@127.0.0.1:3306/riverly_test
      SHADOW_DATABASE_URL: mysql://root:ci_root@127.0.0.1:3306/riverly_shadow
      SESSION_SECRET: ci-session-secret-not-for-production-000
      WORKER_ENABLED: 'false'
      RESEND_WEBHOOK_SECRET: whsec_dGVzdC13ZWJob29rLXNlY3JldC0xMjM0NTY3ODkw

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @project/db generate

      - name: Validate schema
        run: pnpm --filter @project/db exec prisma validate

      - name: Lint OpenAPI spec
        run: pnpm spec:lint

      - name: Check SDK drift
        run: pnpm sdk:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations to a fresh MySQL 8 database
        run: pnpm --filter @project/db exec prisma migrate deploy

      - name: Check schema ↔ migrations drift
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root -e "CREATE DATABASE IF NOT EXISTS riverly_shadow"
          pnpm --filter @project/db exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Test (shared + server)
        run: pnpm --filter @project/shared test && pnpm --filter server exec vitest run

      - name: Build web
        run: VITE_API_URL=/api pnpm --filter web build
