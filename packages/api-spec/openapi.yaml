                    type: object
                    required: [received]
                    properties:
                      received: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }

  # ─────────────────────────── profiles ───────────────────────────
  /profiles/me:
    patch:
      operationId: updateMyProfile
      summary: Update my profile
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /profiles/{slug}:
    get:
      operationId: getProfile
      summary: Internal profile, visible only to members of a company the person belongs to.
      tags: [profiles]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Profile scoped to the viewer's active company
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /recognition-types:
    get:
      operationId: listRecognitionTypes
      summary: List recognition types
      tags: [profiles]
      responses:
        '200':
          description: Enabled stickers/awards
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RecognitionType' }
        '401': { $ref: '#/components/responses/Error' }
  /recognitions:
    post:
      operationId: giveRecognition
      summary: Give recognition
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GiveRecognitionInput' }
      responses:
        '201':
          description: Given — appears on the profile and in Activity
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Recognition' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

        '401': { $ref: '#/components/responses/Error' }
