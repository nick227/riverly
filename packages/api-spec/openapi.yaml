                  data: { $ref: '#/components/schemas/ManageOverview' }
        '403': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /manage/board:
    get:
      operationId: getSalesBoard
      summary: Get the live sales board
      description: >-
        Running totals for today or this week (Monday start) in the company timezone, with the
        same elapsed span one day/week earlier for comparison. Visible to every member.
      tags: [manage]
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [today, week], default: today }
      responses:
        '200':
          description: Board totals, top sale and leaderboard
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SalesBoard' }
        '403': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /reports/pipeline:
    get:
      operationId: getPipelineReport
