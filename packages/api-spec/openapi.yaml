      parameters:
        - in: query
          name: staleDays
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        '200':
          description: Assignments, neglected leads, upcoming inspections and workload
          content:
            application/json:
              schema:
                type: object
                required: [data]
